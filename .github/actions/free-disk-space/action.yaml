name: free-disk-space
description: Free disk space on the runner, only when the root filesystem has less than min-free-gb free

inputs:
  min-free-gb:
    description: Skip the cleanup when the root filesystem has at least this many GB (decimal) free
    required: false
    default: "60"

runs:
  using: composite
  steps:
    - name: Check free disk space
      id: check
      shell: bash
      env:
        MIN_FREE_GB: ${{ inputs.min-free-gb }}
      run: |
        free_gb=$(( $(df --output=avail -B1 / | tail -1) / 1000000000 ))
        if [ "$free_gb" -ge "$MIN_FREE_GB" ]; then
          needed=false
          message="${free_gb} GB free on /, at least ${MIN_FREE_GB} GB: skipping the cleanup"
        else
          needed=true
          message="${free_gb} GB free on /, less than ${MIN_FREE_GB} GB: running the cleanup"
        fi
        echo "needed=${needed}" >> "$GITHUB_OUTPUT"
        echo "${message}"
        echo "🧹 Free disk space: ${message}" >> "$GITHUB_STEP_SUMMARY"

    - name: Install sudo
      if: steps.check.outputs.needed == 'true'
      run: |
        if ! (command -v sudo >/dev/null 2>&1); then
            apt-get -y update
            apt-get -y install sudo
        fi
      shell: bash

    - name: Free Disk Space (Ubuntu)
      if: steps.check.outputs.needed == 'true'
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: true

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false
