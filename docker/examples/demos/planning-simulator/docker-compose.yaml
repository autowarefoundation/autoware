services:
  planning-simulator:
    image: ghcr.io/autowarefoundation/autoware:universe-jazzy
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # create_host_path is off: Compose creates a missing source as root, which 'aw' cannot write.
      - type: bind
        source: ${HOME}/autoware_data/maps
        target: /home/aw/autoware_data/maps
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/autoware_data/ml_models
        target: /home/aw/autoware_data/ml_models
        bind:
          create_host_path: false
    command:
      - bash
      - -c
      - |
        ros2 launch autoware_launch planning_simulator.launch.xml \
          map_path:=/home/aw/autoware_data/maps/sample-map-planning \
          vehicle_model:=sample_vehicle \
          sensor_model:=sample_sensor_kit
        exec bash
