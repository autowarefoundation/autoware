services:
  autoware-devel:
    image: ghcr.io/autowarefoundation/autoware:core-devel-jazzy
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - QT_X11_NO_MITSHM=1
      - NO_AT_BRIDGE=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../..:/home/aw/autoware
      # create_host_path is off: Compose creates a missing source as root, which 'aw' cannot write.
      - type: bind
        source: ${HOME}/autoware_data
        target: /home/aw/autoware_data
        bind:
          create_host_path: false
    working_dir: /home/aw/autoware
    command: bash
