# cspell:ignore Bcumm
- name: Run spconv install
  block:
    - name: Normalize dpkg architecture
      ansible.builtin.set_fact:
        spconv_normalized_arch: "{{ ansible_architecture | regex_replace('aarch64', 'arm64') | regex_replace('x86_64', 'amd64') }}"

    - name: Set architecture suffix
      ansible.builtin.set_fact:
        # CUDA 13 (cu130) ships a single arm64 package for SBSA and Jetson; CUDA 12 (cu128) has one per platform
        spconv_arch_suffix: "{{ '' if (spconv_normalized_arch != 'arm64' or spconv_cuda_tag.startswith('cu13')) else ('-jetson' if spconv_is_jetson | bool else '-sbsa') }}"

    - name: Download the cumm package
      ansible.builtin.get_url:
        mode: "0644"
        url: https://github.com/autowarefoundation/spconv_cpp/releases/download/spconv_v{{ spconv_version }}%2Bcumm_v{{ spconv_cumm_version }}%2B{{ spconv_cuda_tag }}/cumm_{{ spconv_cumm_version }}_{{ spconv_normalized_arch }}{{ spconv_arch_suffix }}.deb
        dest: /tmp/cumm.deb

    - name: Install the cumm package
      become: true
      ansible.builtin.apt:
        deb: /tmp/cumm.deb
        state: present

    - name: Download the spconv package
      ansible.builtin.get_url:
        mode: "0644"
        url: https://github.com/autowarefoundation/spconv_cpp/releases/download/spconv_v{{ spconv_version }}%2Bcumm_v{{ spconv_cumm_version }}%2B{{ spconv_cuda_tag }}/spconv_{{ spconv_version }}_{{ spconv_normalized_arch }}{{ spconv_arch_suffix }}.deb
        dest: /tmp/spconv.deb

    - name: Install the spconv package
      become: true
      ansible.builtin.apt:
        deb: /tmp/spconv.deb
        state: present
