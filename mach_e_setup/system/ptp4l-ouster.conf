# PTP grandmaster for the Ouster OS-1-128 on eno1 (192.168.88.100 -> sensor 192.168.88.37).
# Installed to /etc/linuxptp/ptp4l-ouster.conf, used by ptp4l-ouster.service.
#
# Software timestamping on purpose: eno1 is an Intel I219-LM (e1000e) whose PTP hardware clock runs ~37.5% off
# rate on this platform, so phc2sys cannot lock it (clockcheck resets, 2026-10-13). With software timestamping
# ptp4l serves the NTP-synced system clock directly (no PHC, no phc2sys); accuracy ~10-100 us, plenty for
# lidar/IMU sync. The sensor still timestamps in hardware on its side.
[global]
masterOnly              1
priority1               64
time_stamping           software
network_transport       UDPv4
delay_mechanism         E2E
utc_offset              37
logging_level           6
summary_interval        6

[eno1]
